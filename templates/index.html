<!DOCTYPE html>
<html>
<head>
    <title>url-shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        td, th {
            padding: 8px;
            text-align: left;
        }
        input {
            padding: 10px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 5px;
        }
        a { color: #4CAF50; }
    </style>
</head>
<body>
    <h1>🔗 Shortly  for  URl </h1>
    <form method="POST" action="/">
        <input type="text" name="long_url" placeholder="Paste your long url here" required>
        <button type="submit">Shorten</button>
    </form>

    {% if short_url %}
    <div class="result">
        <p>Short URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
        <button onclick="navigator.clipboard.writeText('{{ short_url }}'); this.textContent='Copied! ✓'">Copy</button>
        <p>🔗 Short URL saved permanently in database!</p>
    </div>
    {% endif %}
    <footer>
        <p>Built with flask & SQLite </p>
    </footer>
    <h2>History</h2>
    <table border="1">
        <tr>
        <th>Original Url</th>
        <th>Short Code</th>
        <th >Clicks</th>
        </tr>
        {% for url in all_urls%}
        <tr>
            <td>{{%utl.long_url}}</td>
            <td>{{url.code}}</td>
            <td>{{url.clicks}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
