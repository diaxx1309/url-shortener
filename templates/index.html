<!DOCTYPE html>
<html>
<head>
    <title>URL SHORTENER </title>
</head>
<body>
    <h1>URL SHORTENER</h1>
        
    <form method="post">
        <input type="text" name="long_url" placeholder="ENTER LONG URL" required>
        <button type="submit">Shorten</button>
    </form>
        
    {% if short_url %}
        <p>Short URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
        <button onclick="navigator.clipboard.writeText('{{short_url}}');'this.textContent='COPIED!✔️">Copy</button>
        <p>Clicks:0 (just created!) </p>
        <p>🔗Short URL saved permanently saved in database! </p>
    {% endif %}

</body>
</html>
